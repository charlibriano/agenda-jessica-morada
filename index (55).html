<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Gerador de Agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Bebas+Neue&family=Caveat:wght@600;700&family=Caveat+Brush&family=Inter:wght@400;600;700;800;900&family=Lora:ital,wght@1,400;1,600&family=Manrope:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: mesa de trabalho escura — prévia grande à esquerda, painel compacto com abas à direita */
:root{
  --bg:#0a0e1a; --panel:#111728; --field:#0c1222; --line:#232c45; --fg:#e9ecf5; --muted:#8a93ad;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --danger:#ff6b6b; --ok:#4cc76a;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:16px;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:#3a4566}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.btn-main:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.stage{min-height:0;min-width:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#141b30,transparent 70%)}
.stage canvas{display:block;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.panel{min-height:0;display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--line);background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:13px 4px;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.wk .lbl{text-align:center;font-weight:800;font-size:15px}
.item{border:1px solid var(--line);border-radius:12px;background:var(--field);display:flex;flex-direction:column}
.item-h{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.item-h .t{min-width:0}
.item-h .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-h .t small{color:var(--muted);font-size:12px}
.item.past{opacity:.55}
.item.off .t b{text-decoration:line-through;color:var(--muted)}
.item-b{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:rgba(76,199,106,.4)}
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
.del{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.del.armed{border-color:var(--danger);color:var(--danger)}
.chip{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.model{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.model b{font-size:13px}.model small{color:var(--muted);font-size:11px;line-height:1.3}
.mini{height:54px;border-radius:7px;overflow:hidden}
.models.lay{grid-template-columns:repeat(2,minmax(0,1fr))}
.fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip.fmt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px}
.chip.fmt b{font-size:14px;color:var(--fg)}.chip.fmt span{font-size:11px}
.chip.fmt[aria-pressed="true"] b{color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--field);border:0;padding:8px 4px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw .b{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none}
.sw .b.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.sw .b.on::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translate(-50%,-65%) rotate(-45deg);filter:drop-shadow(0 0 1.5px rgba(0,0,0,.7))}
.sw .auto{background:conic-gradient(#c2416b,#c98a1a,#d4572a,#4f6b3a,#2d7f9e,#8a4a9c,#c2416b);font-size:0}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.warnbox{border:1px solid rgba(255,107,107,.5);background:rgba(255,107,107,.08);color:#ffd2d2;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2440;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);z-index:20}
.toast.err{border-color:var(--danger);color:#ffd2d2}
.modal{position:fixed;inset:0;background:rgba(4,6,14,.7);display:grid;place-items:center;z-index:30;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.modal-box textarea{min-height:260px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
@media (max-width:900px){
  .app{height:auto;display:block}.work{display:block}
  .stage{height:62vh;padding:12px}
  .panel{border-left:0;border-top:1px solid var(--line);display:block}
  .pane{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand span{display:none}
}
@media (max-width:420px){.acts .btn{padding:8px 10px;font-size:13px}.models{grid-template-columns:1fr 1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Gerador de Agenda</b><span id="topinfo"></span></div>
    <div class="acts"><button class="btn" id="copiar" type="button">Copiar texto</button><button class="btn btn-main" id="baixar" type="button">Baixar PNG</button></div>
  </header>
  <main class="work">
    <section class="stage" aria-label="Prévia da imagem"><canvas id="cv" width="2160" height="3240"></canvas></section>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-semana" data-tab="semana" aria-selected="true">Semana</button>
        <button role="tab" id="tab-eventos" data-tab="eventos" aria-selected="false">Eventos</button>
        <button role="tab" id="tab-fixos" data-tab="fixos" aria-selected="false">Cultos fixos</button>
        <button role="tab" id="tab-visual" data-tab="visual" aria-selected="false">Visual</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="m-texto" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-tit">
  <b id="m-tit">Texto da agenda</b><p class="hint">Não consegui copiar sozinho neste aparelho. O texto já está selecionado: use Copiar do teclado ou segure e escolha Copiar.</p>
  <textarea id="m-area" readonly></textarea><button type="button" class="btn" id="m-fechar">Fechar</button></div></div>

<script>
/* ---------- erros na tela ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg,err){toastEl.textContent=msg;toastEl.className='toast'+(err?' err':'');toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,err?8000:2600)}
window.addEventListener('error',e=>{if(/ResizeObserver loop/.test(e.message||''))return;toast('Erro: '+(e.message||'falha inesperada'),true)});
window.addEventListener('unhandledrejection',e=>toast('Erro: '+((e.reason&&e.reason.message)||e.reason||'falha inesperada'),true));

/* ---------- constantes ---------- */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_UP=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];
const FORMATOS={g23:[1080,1620],feed:[1080,1350],story:[1080,1920],quad:[1080,1080],tela:[1920,1080],a4:[1080,1527]};
const ESCALA_EXPORT={tela:1,a4:2.3};
const F={brush:"'Caveat Brush', 'Comic Sans MS', cursive",hand:"'Caveat', 'Comic Sans MS', cursive",cond:"'Barlow Condensed', 'Arial Narrow', sans-serif",
  nun:"'Nunito', system-ui, sans-serif",bebas:"'Bebas Neue', Impact, sans-serif",osw:"'Oswald', 'Arial Narrow', sans-serif",inter:"'Inter', system-ui, sans-serif",lora:"'Lora', Georgia, serif"};
/* paleta: [nome, forte, fundo claro] */
const PAL=[['Rosa','#c2416b','#f9e1e7'],['Mostarda','#c98a1a','#fbefd6'],['Laranja','#d4572a','#fde6d8'],['Verde','#4f6b3a','#e6eedc'],
  ['Azul','#2d7f9e','#dcedf4'],['Roxo','#8a4a9c','#efe3f3'],['Vermelho','#b83a3a','#f8dddd'],['Turquesa','#1f8a7a','#d8f0eb']];
const VERSOS=[{"g": "Igreja e comunhão", "r": "2 Coríntios 3:18", "t": "Mas todos nós, com rosto descoberto, refletindo como um espelho a glória do Senhor, somos transformados de glória em glória na mesma imagem, como pelo Espírito do Senhor."}, {"g": "Igreja e comunhão", "r": "Salmos 122:1", "t": "Alegrei-me quando me disseram: Vamos à casa do Senhor."}, {"g": "Igreja e comunhão", "r": "Salmos 133:1", "t": "Oh! quão bom e quão suave é que os irmãos vivam em união!"}, {"g": "Igreja e comunhão", "r": "Mateus 18:20", "t": "Pois onde se acham dois ou três reunidos em meu nome, aí estou eu no meio deles."}, {"g": "Igreja e comunhão", "r": "Salmos 118:24", "t": "Este é o dia que o Senhor fez; regozijemo-nos, e alegremo-nos nele."}, {"g": "Igreja e comunhão", "r": "Lamentações 3:22-23", "t": "A benignidade do Senhor jamais acaba, as suas misericórdias não têm fim; renovam-se cada manhã. Grande é a tua fidelidade."}, {"g": "Igreja e comunhão", "r": "Salmos 84:10", "t": "Porque vale mais um dia nos teus átrios do que em outra parte mil. Preferiria estar à porta da casa do meu Deus, a habitar nas tendas da perversidade."}, {"g": "Igreja e comunhão", "r": "Salmos 27:4", "t": "Uma coisa pedi ao Senhor, e a buscarei: que possa morar na casa do Senhor todos os dias da minha vida, para contemplar a formosura do Senhor, e inquirir no seu templo."}, {"g": "Igreja e comunhão", "r": "Romanos 15:13", "t": "Ora, o Deus de esperança vos encha de todo o gozo e paz na vossa fé, para que abundeis na esperança pelo poder do Espírito Santo."}, {"g": "Igreja e comunhão", "r": "Filipenses 4:13", "t": "Posso todas as coisas naquele que me fortalece."}, {"g": "Igreja e comunhão", "r": "Salmos 37:5", "t": "Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará."}, {"g": "Igreja e comunhão", "r": "Provérbios 3:5-6", "t": "Confia no Senhor de todo o teu coração, e não te estribes no teu próprio entendimento. Reconhece-o em todos os teus caminhos, e ele endireitará as tuas veredas."}, {"g": "Igreja e comunhão", "r": "Salmos 23:1", "t": "O Senhor é o meu pastor; nada me faltará."}, {"g": "Igreja e comunhão", "r": "1 Tessalonicenses 5:16-18", "t": "Regozijai-vos sempre. Orai sem cessar. Em tudo dai graças; porque esta é a vontade de Deus em Cristo Jesus para convosco."}, {"g": "Igreja e comunhão", "r": "João 13:34-35", "t": "Um novo mandamento vos dou: que vos ameis uns aos outros; assim como eu vos amei a vós, que também vós vos ameis uns aos outros. Nisto conhecerão todos que sois meus discípulos, se tiverdes amor uns aos outros."}, {"g": "Louvor e adoração", "r": "Salmos 149:3", "t": "Louvem-lhe o nome com danças, cantem-lhe louvores com adufe e harpa."}, {"g": "Louvor e adoração", "r": "Salmos 150:4", "t": "Louvai-o com adufe e com danças; louvai-o com instrumentos de cordas e com flauta!"}, {"g": "Louvor e adoração", "r": "Êxodo 15:20", "t": "Então Miriã, a profetisa, irmã de Arão, tomou na mão um tamboril, e todas as mulheres saíram atrás dela com tamboris, e com danças."}, {"g": "Louvor e adoração", "r": "2 Samuel 6:14", "t": "E Davi dançava com todas as suas forças diante do Senhor; e estava Davi cingido dum éfode de linho."}, {"g": "Louvor e adoração", "r": "Jeremias 31:13", "t": "Então a virgem se alegrará na dança, como também os mancebos e os velhos juntamente; porque tornarei o seu pranto em gozo, e os consolarei, e lhes darei alegria em lugar de tristeza."}, {"g": "Louvor e adoração", "r": "Salmos 150:6", "t": "Tudo quanto tem fôlego louve ao Senhor. Louvai ao Senhor!"}, {"g": "Louvor e adoração", "r": "Salmos 149:1", "t": "Louvai ao Senhor! Cantai ao Senhor um cântico novo, e o seu louvor na assembléia dos santos!"}, {"g": "Louvor e adoração", "r": "Salmos 95:1", "t": "Vinde, cantemos alegremente ao Senhor, cantemos com júbilo à rocha da nossa salvação."}, {"g": "Louvor e adoração", "r": "Salmos 95:6", "t": "Oh, vinde, adoremos e prostremo-nos; ajoelhemos diante do Senhor, que nos criou."}, {"g": "Louvor e adoração", "r": "Salmos 96:9", "t": "Adorai ao Senhor vestidos de trajes santos; tremei diante dele, todos os habitantes da terra."}, {"g": "Louvor e adoração", "r": "Salmos 100:1-2", "t": "Celebrai com júbilo ao Senhor, todos os habitantes da terra. Servi ao Senhor com alegria, e apresentai-vos a ele com cântico."}, {"g": "Louvor e adoração", "r": "Salmos 100:4", "t": "Entrai pelas suas portas com ação de graças, e em seus átrios com louvor; dai-lhe graças e bendizei o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 103:1", "t": "Bendize, ó minha alma, ao Senhor, e tudo o que há em mim bendiga o seu santo nome."}, {"g": "Louvor e adoração", "r": "Salmos 34:1", "t": "Bendirei ao Senhor em todo o tempo; o seu louvor estará continuamente na minha boca."}, {"g": "Louvor e adoração", "r": "Salmos 34:3", "t": "Engrandeci ao Senhor comigo, e juntos exaltemos o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 63:4", "t": "Assim eu te bendirei enquanto viver; em teu nome levantarei as minhas mãos."}, {"g": "Louvor e adoração", "r": "Salmos 134:2", "t": "Erguei as mãos para o santuário, e bendizei ao Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 141:2", "t": "Suba a minha oração, como incenso, diante de ti, e seja o levantar das minhas mãos como o sacrifício da tarde!"}, {"g": "Louvor e adoração", "r": "Salmos 145:3", "t": "Grande é o Senhor, e mui digno de ser louvado; e a sua grandeza é insondável."}, {"g": "Louvor e adoração", "r": "Salmos 146:2", "t": "Louvarei ao Senhor durante a minha vida; cantarei louvores ao meu Deus enquanto viver."}, {"g": "Louvor e adoração", "r": "Salmos 147:1", "t": "Louvai ao Senhor; porque é bom cantar louvores ao nosso Deus; pois isso é agradável, e decoroso é o louvor."}, {"g": "Louvor e adoração", "r": "Salmos 33:3", "t": "Cantai-lhe um cântico novo; tocai bem e com júbilo."}, {"g": "Louvor e adoração", "r": "Salmos 40:3", "t": "Pôs na minha boca um cântico novo, um hino ao nosso Deus; muitos verão isso e temerão, e confiarão no Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 47:1", "t": "Batei palmas, todos os povos; aclamai a Deus com voz de júbilo."}, {"g": "Louvor e adoração", "r": "Salmos 66:4", "t": "Toda a terra te adorará e te cantará louvores; eles cantarão o teu nome."}, {"g": "Louvor e adoração", "r": "Salmos 29:2", "t": "Tributai ao Senhor a glória devida ao seu nome; adorai o Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "Salmos 113:3", "t": "Desde o nascimento do sol até o seu ocaso, há de ser louvado o nome do Senhor."}, {"g": "Louvor e adoração", "r": "1 Crônicas 16:29", "t": "Tributai ao Senhor a glória devida ao seu nome; trazei presentes, e vinde perante ele; adorai ao Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "João 4:23", "t": "Mas a hora vem, e agora é, em que os verdadeiros adoradores adorarão o Pai em espírito e em verdade; porque o Pai procura a tais que assim o adorem."}, {"g": "Louvor e adoração", "r": "João 4:24", "t": "Deus é Espírito, e é necessário que os que o adoram o adorem em espírito e em verdade."}, {"g": "Louvor e adoração", "r": "Romanos 12:1", "t": "Rogo-vos pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos como um sacrifício vivo, santo e agradável a Deus, que é o vosso culto racional."}, {"g": "Louvor e adoração", "r": "Hebreus 13:15", "t": "Por ele, pois, ofereçamos sempre a Deus sacrifício de louvor, isto é, o fruto dos lábios que confessam o seu nome."}, {"g": "Louvor e adoração", "r": "Colossenses 3:16", "t": "A palavra de Cristo habite em vós ricamente, em toda a sabedoria; ensinai-vos e admoestai-vos uns aos outros, com salmos, hinos e cânticos espirituais, louvando a Deus com gratidão em vossos corações."}, {"g": "Louvor e adoração", "r": "Apocalipse 4:11", "t": "Digno és, Senhor nosso e Deus nosso, de receber a glória e a honra e o poder; porque tu criaste todas as coisas, e por tua vontade existiram e foram criadas."}, {"g": "Louvor e adoração", "r": "Sofonias 3:17", "t": "O Senhor teu Deus está no   else if(a==='delEv'){if(!arma('Confirmar','Apagar evento'))return;S.eventos=S.eventos.filter(x=>x.id!==ev.id);aberto=null;save();draw();showTab('eventos',true);toast('Evento apagado')}
  else if(a==='limparPassados'){if(!arma('Clique de novo para confirmar','Apagar os que já passaram'))return;const h=pd(S.ini);const n0=S.eventos.length;S.eventos=S.eventos.filter(e=>!(e.ini&&pd(e.fim||e.ini)<h));save();showTab('eventos',true);toast(`${n0-S.eventos.length} evento(s) apagado(s)`)}
  else if(a==='novoFixo'){S.fixos.push({id:uid('f'),nome:'Novo culto',dia:3,hora:'20h',local:'',icone:'auto',cor:'auto'});save();draw();showTab('fixos',true);const l=pane.querySelectorAll('[data-k="nome"]');const n=l[l.length-1];if(n){n.scrollIntoView({block:'center'});n.select()}}
  else if(a==='delFixo'){if(!arma('Confirmar','Remover'))return;const id=b.closest('[data-fid]').dataset.fid;S.fixos=S.fixos.filter(f=>f.id!==id);save();draw();showTab('fixos',true)}
  else if(a==='cor'){const alvo=b.dataset.alvo;const o=evById(alvo)||fxById(alvo);if(o){o.cor=b.dataset.v;b.parentElement.querySelectorAll('.b').forEach(x=>x.classList.toggle('on',x===b));const it2=b.closest('.item');const dt=it2&&it2.querySelector('.dot');if(dt)dt.style.background=corDe(o,evById(alvo)?hashIdx(o.id):S.fixos.indexOf(o)).f;save();draw()}}
  else if(a==='modelo'){S.modelo=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='formato'){S.formato=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='layout'){S.layout=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='logo'){S.logo=b.dataset.v==='true';save();draw();showTab('visual',true)}
  else if(a==='sortear'){let i;const cur=VERSOS.findIndex(v=>v.r===S.referencia&&v.t===S.versiculo);do{i=Math.floor(Math.random()*VERSOS.length)}while(i===cur);S.versiculo=VERSOS[i].t;S.referencia=VERSOS[i].r;save();draw();showTab('visual',true);toast(VERSOS[i].r)}
  else if(a==='reset'){if(!arma('Clique de novo para confirmar','Restaurar agenda de exemplo'))return;S=JSON.parse(JSON.stringify(DEFAULT));aberto=null;save();draw();showTab('visual');toast('Agenda de exemplo restaurada')}});

/* ---------- texto para o WhatsApp ---------- */
function textoAgenda(){const L=[`*${[S.titulo1,S.titulo2].filter(Boolean).join(' ').toUpperCase()}* (${rotuloSemana()})`];
  agendaItens().forEach(a=>{L.push(`*${DIAS[a.data.getDay()]} ${dm(a.data)}* — ${a.titulo}${a.hora?' · '+a.hora:''}${a.local?' · '+a.local:''}`)});
  const av=avisosItens();if(av.length){L.push('');L.push(`*${(S.avisos||'AVISOS').toUpperCase()}*`);
    av.forEach(a=>{const p=a.pill?a.pill.join(' ').replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/ A /,' a ').replace(/ E /,' e '):'';
      let l=`• ${p?`*${p}* — `:''}*${a.titulo}*`;if(a.sub)l+=` (${a.sub})`;if(a.hora)l+=` · ${a.hora}`;if(a.local)l+=` · ${a.local}`;if(a.valor)l+=` · ${a.valor}`;if(a.selo)l+=` · _${a.selo}_`;L.push(l);
      if(a.desc)L.push('  '+a.desc);a.contatos.forEach(c=>L.push(`  📞 ${c.r?c.r+': ':''}${c.n}`))})}
  const v=String(S.versiculo||'').trim();if(v){L.push('');L.push(`_“${v}”_`);if(S.referencia)L.push(S.referencia)}
  if(S.rodape){L.push('');L.push(S.rodape)}return L.join('\n')}
document.getElementById('copiar').addEventListener('click',()=>{const txt=textoAgenda();const manual=()=>{const m=document.getElementById('m-texto'),a=document.getElementById('m-area');a.value=txt;m.hidden=false;a.focus();a.select()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Texto copiado. É só colar no grupo.'),manual);else manual()}catch(e){manual()}});
document.getElementById('m-fechar').addEventListener('click',()=>{document.getElementById('m-texto').hidden=true});
document.getElementById('m-texto').addEventListener('click',e=>{if(e.target.id==='m-texto')e.target.hidden=true});

/* ---------- download ---------- */
document.getElementById('baixar').addEventListener('click',async()=>{const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob){toast('Não foi possível gerar a imagem.',true);return}
  const nome=`agenda-${S.ini}.png`;
  if(window.claude&&typeof window.claude.use==='function'){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:nome,data:blob});toast('Imagem salva');return}}
    catch(err){if(err&&err.code==='declined'){toast('Download cancelado');return}if(err&&err.code==='rate_limited'){toast('Aguarde um instante e tente de novo.');return}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)});

/* ---------- início ---------- */
showTab('semana');draw();
const fontes=['400 40px "Caveat Brush"','700 40px Caveat','600 40px Caveat','700 40px "Barlow Condensed"','700 40px Nunito','800 40px Nunito','600 40px Nunito','400 40px "Bebas Neue"','600 40px Oswald','800 40px Inter','900 40px Inter','600 40px Inter','italic 400 40px Lora'];
if(document.fonts){Promise.all(fontes.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>draw());document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>draw())}
</script>
