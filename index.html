<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Gerador de Agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Fredoka:wght@500;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,600&family=Righteous&family=Special+Elite&family=Bebas+Neue&family=Caveat:wght@600;700&family=Caveat+Brush&family=Inter:wght@400;600;700;800;900&family=Lora:ital,wght@1,400;1,600&family=Manrope:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: mesa de trabalho escura — prévia grande à esquerda, painel compacto com abas à direita */
:root{
  --bg:#0a0e1a; --panel:#111728; --field:#0c1222; --line:#232c45; --fg:#e9ecf5; --muted:#8a93ad;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --danger:#ff6b6b; --ok:#4cc76a;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:16px;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.top{flex-wrap:wrap}.acts{width:100%;justify-content:space-between}.acts .btn{padding:7px 10px;font-size:13px}}
.pager{display:flex;align-items:center;gap:6px}.pager b{font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.figrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.figrow .figc{width:52px;height:52px;border-radius:10px;border:1px solid var(--line)}
.figtxt{display:flex;flex-direction:column;min-width:0}.figtxt b{color:var(--fg);font-size:13px}.figtxt small{font-size:11px;color:var(--muted);font-weight:600}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:4px}
.figb{position:relative;padding:0;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer;aspect-ratio:1;max-width:100%}
.figb .figc{width:100%;height:100%;border-radius:8px;display:block}
.figb.on{border-color:var(--accent)}.figb i{position:absolute;left:0;right:0;bottom:1px;font-size:9px;font-style:normal;font-weight:800;color:var(--accent);text-align:center}
.infobox{border:1px solid rgba(255,138,61,.45);background:rgba(255,138,61,.08);color:#ffd9bf;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:#3a4566}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.btn-main:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.stage{min-height:0;min-width:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#141b30,transparent 70%)}
.stage canvas{display:block;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.panel{min-height:0;display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--line);background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:13px 4px;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.wk .lbl{text-align:center;font-weight:800;font-size:15px}
.item{border:1px solid var(--line);border-radius:12px;background:var(--field);display:flex;flex-direction:column}
.item-h{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.item-h .t{min-width:0}
.item-h .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-h .t small{color:var(--muted);font-size:12px}
.item.past{opacity:.55}
.item.off .t b{text-decoration:line-through;color:var(--muted)}
.item-b{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:rgba(76,199,106,.4)}
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
.del{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.del.armed{border-color:var(--danger);color:var(--danger)}
.chip{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.model{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.model b{font-size:13px}.model small{color:var(--muted);font-size:11px;line-height:1.3}
.mini{height:54px;border-radius:7px;overflow:hidden}
.models.lay{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:901px){.models.lay{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip.fmt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px}
.chip.fmt b{font-size:14px;color:var(--fg)}.chip.fmt span{font-size:11px}
.chip.fmt[aria-pressed="true"] b{color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--field);border:0;padding:8px 4px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw .b{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none}
.sw .b.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.sw .b.on::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translate(-50%,-65%) rotate(-45deg);filter:drop-shadow(0 0 1.5px rgba(0,0,0,.7))}
.sw .auto{background:conic-gradient(#c2416b,#c98a1a,#d4572a,#4f6b3a,#2d7f9e,#8a4a9c,#c2416b);font-size:0}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.warnbox{border:1px solid rgba(255,107,107,.5);background:rgba(255,107,107,.08);color:#ffd2d2;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2440;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);z-index:20}
.toast.err{border-color:var(--danger);color:#ffd2d2}
.modal{position:fixed;inset:0;background:rgba(4,6,14,.7);display:grid;place-items:center;z-index:30;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.modal-box textarea{min-height:260px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
@media (max-width:900px){
  .app{height:auto;display:block}.work{display:block}
  .stage{height:62vh;padding:12px}
  .panel{border-left:0;border-top:1px solid var(--line);display:block}
  .pane{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand span{display:none}
}
@media (max-width:420px){.acts .btn{padding:8px 10px;font-size:13px}.models{grid-template-columns:1fr 1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Gerador de Agenda</b><span id="topinfo"></span></div>
    <div class="acts"><span class="pager" id="pager" hidden><button class="btn sm" id="pgPrev" type="button" aria-label="Imagem anterior">◀</button><b id="pgLbl">1/1</b><button class="btn sm" id="pgNext" type="button" aria-label="Próxima imagem">▶</button></span><button class="btn" id="copiar" type="button">Copiar texto</button><button class="btn" id="baixarTodas" type="button" hidden>Baixar todas</button><button class="btn btn-main" id="baixar" type="button">Baixar PNG</button></div>
  </header>
  <main class="work">
    <section class="stage" aria-label="Prévia da imagem"><canvas id="cv" width="2160" height="3240"></canvas></section>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-semana" data-tab="semana" aria-selected="true">Semana</button>
        <button role="tab" id="tab-eventos" data-tab="eventos" aria-selected="false">Eventos</button>
        <button role="tab" id="tab-fixos" data-tab="fixos" aria-selected="false">Cultos fixos</button>
        <button role="tab" id="tab-visual" data-tab="visual" aria-selected="false">Visual</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="m-texto" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-tit">
  <b id="m-tit">Texto da agenda</b><p class="hint">Não consegui copiar sozinho neste aparelho. O texto já está selecionado: use Copiar do teclado ou segure e escolha Copiar.</p>
  <textarea id="m-area" readonly></textarea><button type="button" class="btn" id="m-fechar">Fechar</button></div></div>

<script>
/* ---------- erros na tela ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg,err){toastEl.textContent=msg;toastEl.className='toast'+(err?' err':'');toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,err?8000:2600)}
window.addEventListener('error',e=>{if(/ResizeObserver loop/.test(e.message||''))return;toast('Erro: '+(e.message||'falha inesperada'),true)});
window.addEventListener('unhandledrejection',e=>toast('Erro: '+((e.reason&&e.reason.message)||e.reason||'falha inesperada'),true));

/* ---------- constantes ---------- */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_UP=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];
const FORMATOS={g23:[1080,1620],feed:[1080,1350],story:[1080,1920],quad:[1080,1080],tela:[1920,1080],a4:[1080,1527]};
const ESCALA_EXPORT={tela:1,a4:2.3};
const F={play:"'Playfair Display', Georgia, serif",right:"'Righteous', Impact, sans-serif",arch:"'Archivo Black', Impact, sans-serif",elite:"'Special Elite', 'Courier New', monospace",fred:"'Fredoka', 'Nunito', sans-serif",paci:"'Pacifico', cursive",brush:"'Caveat Brush', 'Comic Sans MS', cursive",hand:"'Caveat', 'Comic Sans MS', cursive",cond:"'Barlow Condensed', 'Arial Narrow', sans-serif",
  nun:"'Nunito', system-ui, sans-serif",bebas:"'Bebas Neue', Impact, sans-serif",osw:"'Oswald', 'Arial Narrow', sans-serif",inter:"'Inter', system-ui, sans-serif",lora:"'Lora', Georgia, serif"};
/* paleta: [nome, forte, fundo claro] */
const PAL=[['Rosa','#c2416b','#f9e1e7'],['Mostarda','#c98a1a','#fbefd6'],['Laranja','#d4572a','#fde6d8'],['Verde','#4f6b3a','#e6eedc'],
  ['Azul','#2d7f9e','#dcedf4'],['Roxo','#8a4a9c','#efe3f3'],['Vermelho','#b83a3a','#f8dddd'],['Turquesa','#1f8a7a','#d8f0eb']];
const VERSOS=[{"g": "Igreja e comunhão", "r": "2 Coríntios 3:18", "t": "Mas todos nós, com rosto descoberto, refletindo como um espelho a glória do Senhor, somos transformados de glória em glória na mesma imagem, como pelo Espírito do Senhor."}, {"g": "Igreja e comunhão", "r": "Salmos 122:1", "t": "Alegrei-me quando me disseram: Vamos à casa do Senhor."}, {"g": "Igreja e comunhão", "r": "Salmos 133:1", "t": "Oh! quão bom e quão suave é que os irmãos vivam em união!"}, {"g": "Igreja e comunhão", "r": "Mateus 18:20", "t": "Pois onde se acham dois ou três reunidos em meu nome, aí estou eu no meio deles."}, {"g": "Igreja e comunhão", "r": "Salmos 118:24", "t": "Este é o dia que o Senhor fez; regozijemo-nos, e alegremo-nos nele."}, {"g": "Igreja e comunhão", "r": "Lamentações 3:22-23", "t": "A benignidade do Senhor jamais acaba, as suas misericórdias não têm fim; renovam-se cada manhã. Grande é a tua fidelidade."}, {"g": "Igreja e comunhão", "r": "Salmos 84:10", "t": "Porque vale mais um dia nos teus átrios do que em outra parte mil. Preferiria estar à porta da casa do meu Deus, a habitar nas tendas da perversidade."}, {"g": "Igreja e comunhão", "r": "Salmos 27:4", "t": "Uma coisa pedi ao Senhor, e a buscarei: que possa morar na casa do Senhor todos os dias da minha vida, para contemplar a formosura do Senhor, e inquirir no seu templo."}, {"g": "Igreja e comunhão", "r": "Romanos 15:13", "t": "Ora, o Deus de esperança vos encha de todo o gozo e paz na vossa fé, para que abundeis na esperança pelo poder do Espírito Santo."}, {"g": "Igreja e comunhão", "r": "Filipenses 4:13", "t": "Posso todas as coisas naquele que me fortalece."}, {"g": "Igreja e comunhão", "r": "Salmos 37:5", "t": "Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará."}, {"g": "Igreja e comunhão", "r": "Provérbios 3:5-6", "t": "Confia no Senhor de todo o teu coração, e não te estribes no teu próprio entendimento. Reconhece-o em todos os teus caminhos, e ele endireitará as tuas veredas."}, {"g": "Igreja e comunhão", "r": "Salmos 23:1", "t": "O Senhor é o meu pastor; nada me faltará."}, {"g": "Igreja e comunhão", "r": "1 Tessalonicenses 5:16-18", "t": "Regozijai-vos sempre. Orai sem cessar. Em tudo dai graças; porque esta é a vontade de Deus em Cristo Jesus para convosco."}, {"g": "Igreja e comunhão", "r": "João 13:34-35", "t": "Um novo mandamento vos dou: que vos ameis uns aos outros; assim como eu vos amei a vós, que também vós vos ameis uns aos outros. Nisto conhecerão todos que sois meus discípulos, se tiverdes amor uns aos outros."}, {"g": "Louvor e adoração", "r": "Salmos 149:3", "t": "Louvem-lhe o nome com danças, cantem-lhe louvores com adufe e harpa."}, {"g": "Louvor e adoração", "r": "Salmos 150:4", "t": "Louvai-o com adufe e com danças; louvai-o com instrumentos de cordas e com flauta!"}, {"g": "Louvor e adoração", "r": "Êxodo 15:20", "t": "Então Miriã, a profetisa, irmã de Arão, tomou na mão um tamboril, e todas as mulheres saíram atrás dela com tamboris, e com danças."}, {"g": "Louvor e adoração", "r": "2 Samuel 6:14", "t": "E Davi dançava com todas as suas forças diante do Senhor; e estava Davi cingido dum éfode de linho."}, {"g": "Louvor e adoração", "r": "Jeremias 31:13", "t": "Então a virgem se alegrará na dança, como também os mancebos e os velhos juntamente; porque tornarei o seu pranto em gozo, e os consolarei, e lhes darei alegria em lugar de tristeza."}, {"g": "Louvor e adoração", "r": "Salmos 150:6", "t": "Tudo quanto tem fôlego louve ao Senhor. Louvai ao Senhor!"}, {"g": "Louvor e adoração", "r": "Salmos 149:1", "t": "Louvai ao Senhor! Cantai ao Senhor um cântico novo, e o seu louvor na assembléia dos santos!"}, {"g": "Louvor e adoração", "r": "Salmos 95:1", "t": "Vinde, cantemos alegremente ao Senhor, cantemos com júbilo à rocha da nossa salvação."}, {"g": "Louvor e adoração", "r": "Salmos 95:6", "t": "Oh, vinde, adoremos e prostremo-nos; ajoelhemos diante do Senhor, que nos criou."}, {"g": "Louvor e adoração", "r": "Salmos 96:9", "t": "Adorai ao Senhor vestidos de trajes santos; tremei diante dele, todos os habitantes da terra."}, {"g": "Louvor e adoração", "r": "Salmos 100:1-2", "t": "Celebrai com júbilo ao Senhor, todos os habitantes da terra. Servi ao Senhor com alegria, e apresentai-vos a ele com cântico."}, {"g": "Louvor e adoração", "r": "Salmos 100:4", "t": "Entrai pelas suas portas com ação de graças, e em seus átrios com louvor; dai-lhe graças e bendizei o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 103:1", "t": "Bendize, ó minha alma, ao Senhor, e tudo o que há em mim bendiga o seu santo nome."}, {"g": "Louvor e adoração", "r": "Salmos 34:1", "t": "Bendirei ao Senhor em todo o tempo; o seu louvor estará continuamente na minha boca."}, {"g": "Louvor e adoração", "r": "Salmos 34:3", "t": "Engrandeci ao Senhor comigo, e juntos exaltemos o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 63:4", "t": "Assim eu te bendirei enquanto viver; em teu nome levantarei as minhas mãos."}, {"g": "Louvor e adoração", "r": "Salmos 134:2", "t": "Erguei as mãos para o santuário, e bendizei ao Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 141:2", "t": "Suba a minha oração, como incenso, diante de ti, e seja o levantar das minhas mãos como o sacrifício da tarde!"}, {"g": "Louvor e adoração", "r": "Salmos 145:3", "t": "Grande é o Senhor, e mui digno de ser louvado; e a sua grandeza é insondável."}, {"g": "Louvor e adoração", "r": "Salmos 146:2", "t": "Louvarei ao Senhor durante a minha vida; cantarei louvores ao meu Deus enquanto viver."}, {"g": "Louvor e adoração", "r": "Salmos 147:1", "t": "Louvai ao Senhor; porque é bom cantar louvores ao nosso Deus; pois isso é agradável, e decoroso é o louvor."}, {"g": "Louvor e adoração", "r": "Salmos 33:3", "t": "Cantai-lhe um cântico novo; tocai bem e com júbilo."}, {"g": "Louvor e adoração", "r": "Salmos 40:3", "t": "Pôs na minha boca um cântico novo, um hino ao nosso Deus; muitos verão isso e temerão, e confiarão no Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 47:1", "t": "Batei palmas, todos os povos; aclamai a Deus com voz de júbilo."}, {"g": "Louvor e adoração", "r": "Salmos 66:4", "t": "Toda a terra te adorará e te cantará louvores; eles cantarão o teu nome."}, {"g": "Louvor e adoração", "r": "Salmos 29:2", "t": "Tributai ao Senhor a glória devida ao seu nome; adorai o Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "Salmos 113:3", "t": "Desde o nascimento do sol até o seu ocaso, há de ser louvado o nome do Senhor."}, {"g": "Louvor e adoração", "r": "1 Crônicas 16:29", "t": "Tributai ao Senhor a glória devida ao seu nome; trazei presentes, e vinde perante ele; adorai ao Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "João 4:23", "t": "Mas a hora vem, e agora é, em que os verdadeiros adoradores adorarão o Pai em espírito e em verdade; porque o Pai procura a tais que assim o adorem."}, {"g": "Louvor e adoração", "r": "João 4:24", "t": "Deus é Espírito, e é necessário que os que o adoram o adorem em espírito e em verdade."}, {"g": "Louvor e adoração", "r": "Romanos 12:1", "t": "Rogo-vos pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos como um sacrifício vivo, santo e agradável a Deus, que é o vosso culto racional."}, {"g": "Louvor e adoração", "r": "Hebreus 13:15", "t": "Por ele, pois, ofereçamos sempre a Deus sacrifício de louvor, isto é, o fruto dos lábios que confessam o seu nome."}, {"g": "Louvor e adoração", "r": "Colossenses 3:16", "t": "A palavra de Cristo habite em vós ricamente, em toda a sabedoria; ensinai-vos e admoestai-vos uns aos outros, com salmos, hinos e cânticos espirituais, louvando a Deus com gratidão em vossos corações."}, {"g": "Louvor e adoração", "r": "Apocalipse 4:11", "t": "Digno és, Senhor nosso e Deus nosso, de receber a glória e a honra e o poder; porque tu criaste todas as coisas, e por tua vontade existiram e foram criadas."}, {"g": "Louvor e adoração", "r": "Sofonias 3:17", "t": "O Senhor teu Deus está no meio de ti, poderoso para te salvar; ele se deleitará em ti com alegria; renovar-te-á no seu amor, regozijar-se-á em ti com júbilo."}, {"g": "Louvor e adoração", "r": "Filipenses 4:4", "t": "Regozijai-vos sempre no Senhor; outra vez digo, regozijai-vos."}];

    if(larga){const cw=(w-gap*6)/7;let hmax=0;const hs=dias.map(d=>{let hh=70*s;itensDia(d).forEach(it=>{hh+=ficha(ctx,T,it,0,0,cw,s,false,true).h+8*s});return hh});hmax=Math.max(...hs,160*s);
      dias.forEach((d,i)=>{const x=mx+i*(cw+gap);if(draw){rr(ctx,x,y,cw,hmax,14*s);ctx.fillStyle=ESCURO()?'rgba(255,255,255,.04)':'rgba(255,255,255,.5)';ctx.fill();

          ctx.font=`700 ${34*s}px ${F.cond}`;ctx.fillStyle=TP.ink;ctx.fillText(p2(d.getDate()),x+cw/2,y+60*s);ctx.textAlign='left'}
        let yy=y+70*s;const L=itensDia(d);if(!L.length&&draw){ctx.fillStyle=TP.muted;ctx.textAlign='center';ctx.font=`600 ${18*s}px ${T.bodyF}`;ctx.fillText('—',x+cw/2,yy+30*s);ctx.textAlign='left'}
        L.forEach(it=>{const f=ficha(ctx,T,it,x+4*s,yy,cw-8*s,s,draw,true);yy+=f.h+8*s})});y+=hmax+gap}
    else{const lw=120*s,rw=w-lw-14*s;dias.forEach((d,i)=>{const L=itensDia(d);let hh=0,rowH=0,cx=0;const pos=[];
        const cheio=L.length===1;L.forEach(it=>{const f=ficha(ctx,T,it,0,0,rw,s,false,cheio);if(cx>0&&cx+f.w>rw){hh+=rowH+8*s;cx=0;rowH=0}pos.push([cx,hh]);cx+=f.w+8*s;rowH=Math.max(rowH,f.h)});hh+=rowH;

          ctx.font=`700 ${40*s}px ${F.cond}`;ctx.fillStyle=vazio?TP.muted:TP.ink;ctx.fillText(p2(d.getDate())+'/'+p2(d.getMonth()+1),mx+lw/2,y+h/2+22*s);ctx.textAlign='left';
          if(vazio){ctx.fillStyle=TP.muted;ctx.font=`italic 600 ${18*s}px ${T.bodyF}`;ctx.fillText('sem programação',mx+lw+14*s,y+h/2+6*s)}
          L.forEach((it,j)=>ficha(ctx,T,it,mx+lw+14*s+pos[j][0],y+pos[j][1],rw,s,true,cheio));

/* LINHA DO TEMPO: linha vertical com eventos alternando dos dois lados */

    yy=blocoTexto(ctx,T,it.sub,x+pad,yy,iw,s,d,'left',20,700,T.ink);if(!COMPACT)yy=blocoTexto(ctx,T,it.desc,x+pad,yy,iw,s,d,'left',18,600,T.muted);
    yy=metaInline(ctx,T,it,x+pad,yy,iw,s,d);yy=COMPACT?contatoLinha(ctx,T,it,x+pad,yy,iw,s,d):blocoContatos(ctx,T,it,x+pad+4*s,yy,iw-8*s,s,d);yy=blocoSelo(ctx,T,it,x+pad,yy,iw,s,d,'left');return yy};

function layoutLinhaTempo(ctx,T,W,P,mx,y,w,s,draw,gap,larga){const TP=temaPagina(T);const datados=[...P.ag,...P.av.filter(a=>a.d0)].sort((a,b)=>a.d0-b.d0);const gerais=P.av.filter(a=>!a.d0);

/* MOSAICO: bloco grande + bloco "Esta semana" lado a lado, resto em blocos menores */
function layoutMosaico(ctx,T,W,P,mx,y,w,s,draw,gap,larga){const av=P.av;const hi=av.findIndex(a=>a.destaque);const k=hi>=0?hi:Math.max(0,av.findIndex(a=>a.d0));const hero=av.length?av[k]:null;const resto=av.filter((_,i)=>i!==k||!hero);

    const heroH=hero?blocoHero(ctx,T,hero,0,0,hw,s,false):0;
    const sem=()=>{let hh=20*s+46*s;P.ag.forEach(it=>{hh+=ficha(ctx,T,it,0,0,sw-24*s,s,false,true).h+8*s});return hh+10*s};const semH=P.ag.length?sem():0;const H=Math.max(heroH,semH);

function blocoHero(ctx,T,it,x,y,w,s,draw,hFix){const c=it.cor,pad=26*s,iw=w-pad*2;const corpo=(yy,d)=>{const isz=96*s;if(d)blocoIcone(ctx,T,c,it.ic,x+pad+isz/2,yy+isz/2,isz,true);

    yy=blocoTitulo(ctx,T,c,it.titulo,x+pad,yy,iw,s,d,'left',1.5,3);yy=blocoTexto(ctx,T,it.sub,x+pad,yy,iw,s,d,'left',23,700,T.ink);if(!COMPACT)yy=blocoTexto(ctx,T,it.desc,x+pad,yy,iw,s,d,'left',20,600,T.muted);

/* LINE-UP: só tipografia, sem caixas — data enorme, título forte */

  const tsz=T.titleSz*1.02*s;const tt=String(it.titulo).toUpperCase();const fam=S.modelo==='aquarela'?F.brush:(S.modelo==='clean'||S.modelo==='gradiente'?T.titleF:F.bebas);const wt=S.modelo==='aquarela'||fam===F.bebas?400:T.titleW;
  const sz=fam===F.bebas?tsz*1.35:tsz;const corpo=(yy,d)=>{const R=fitLines(ctx,tt,wt,fam,sz,tw,2,sz*.6);const lh=R.s*(fam===F.bebas?.92:1.05);
      if(d){ctx.font=`${wt} ${R.s}px ${fam}`;ctx.fillStyle=TP.ink;if(fam===F.bebas)setLS(ctx,R.s*.02);R.L.forEach((l,i)=>ctx.fillText(l,tx,yy+R.s*.8+i*lh));setLS(ctx,0)}
      yy+=R.L.length*lh+6*s;yy=blocoTexto(ctx,TP,it.sub,tx,yy,tw,s,d,'left',20,700,c.f===undefined?TP.ink:(ESCURO()?mix(c.f,'#ffffff',.5):c.f));
      if(!COMPACT)yy=blocoTexto(ctx,TP,it.desc,tx,yy,tw,s,d,'left',18,600,TP.muted);yy=metaInline(ctx,TP,it,tx,yy,tw,s,d);yy=contatoLinha(ctx,TP,it,tx,yy,tw,s,d);yy=blocoSelo(ctx,T,it,tx,yy,tw,s,d,'left');return yy};

    if(lin){const big=lin[1].length>3?52*s:92*s;ctx.font=`400 ${big}px ${F.bebas}`;const bf=Math.min(big,big*dw/Math.max(1,ctx.measureText(lin[1]).width));ctx.font=`400 ${bf}px ${F.bebas}`;ctx.fillText(lin[1],x,y+bf*.82);
      const sub=`${lin[0]} · ${lin[2]}`;setLS(ctx,1.5*s);ctx.font=`700 ${17*s}px ${F.cond}`;const sf=Math.min(17*s,17*s*(dw-4*s)/Math.max(1,ctx.measureText(sub).width));ctx.font=`700 ${sf}px ${F.cond}`;ctx.fillText(sub,x+2*s,y+bf*.82+24*s);setLS(ctx,0)}
    else figura(ctx,it.ic,x+40*s,y+40*s,70*s,dc,ESCURO()?interior(c):'#ffffff');
    corpo(y,true);ctx.fillStyle=ESCURO()?'rgba(255,255,255,.14)':rgba(TP.ink,.14);ctx.fillRect(x,y+h-10*s,w,1.5*s)}

function layoutLineup(ctx,T,W,P,mx,y,w,s,draw,gap,larga){const blocoL=(itens,titulo)=>{if(!itens.length)return;y+=rotulo(ctx,T,titulo,mx,y,w,s,draw)+16*s;

    itens.forEach(it=>{let k=0;for(let i=1;i<nc;i++)if(ys[i]<ys[k]-1)k=i;const h=itemLineup(ctx,T,it,mx+k*(cw+gap*2),ys[k],cw,s,draw);ys[k]+=h+8*s});y=Math.max(...ys)+8*s};
  blocoL(P.ag,'Esta semana');blocoL(P.av,S.avisos||'Avisos');return y}

function layout(ctx,W,H,s,draw,P){P=P||{ag:agendaItens(),av:avisosItens()};const T=tema(),U=Math.min(W,H),mx=W>H?W*.04:W*.045,gap=16*s,larga=W/H>1.2;let y=U*.05;const w=W-mx*2;
  y+=cabecalho(ctx,T,W,y,s,draw)+28*s;
  const ag=P.ag,av=P.av;const cap=larga?5:4;const L=S.layout;
  const agCartoes=()=>{const n=ag.length;const por=n<=cap?n:Math.ceil(n/Math.ceil(n/cap));const lin=[];for(let i=0;i<n;i+=por)lin.push(ag.slice(i,i+por).map(it=>({it,p:1})));return lin};
  if(L==='lista'){
    if(larga&&(!ag.length||!av.length)){const so=ag.length?ag:av;y+=rotulo(ctx,T,ag.length?'Esta semana':(S.avisos||'Avisos'),mx,y,w,s,draw)+10*s;y=colunasDeLinhas(ctx,T,so,mx,y,w,2,s,draw,gap*.75)}
    else if(larga){const cw=(w-gap*2)/2;let y1=y,y2=y;y1+=rotulo(ctx,T,'Esta semana',mx,y1,cw,s,draw)+10*s;y1=colunasDeLinhas(ctx,T,ag,mx,y1,cw,1,s,draw,gap*.75);
      if(av.length){y2+=rotulo(ctx,T,S.avisos||'Avisos',mx+cw+gap*2,y2,cw,s,draw)+10*s;y2=colunasDeLinhas(ctx,T,av,mx+cw+gap*2,y2,cw,1,s,draw,gap*.75)}y=Math.max(y1,y2)}
    else{if(ag.length){y+=rotulo(ctx,T,'Esta semana',mx,y,w,s,draw)+10*s;y=colunasDeLinhas(ctx,T,ag,mx,y,w,ag.length>4&&W>=1000?2:1,s,draw,gap*.75)}
      if(av.length){y+=8*s;y+=divisoria(ctx,T,W,y,s,draw)+14*s;y=colunasDeLinhas(ctx,T,av,mx,y,w,av.length>5?2:1,s,draw,gap*.75)}}}
  else if(L==='colunas'&&!ag.length){if(av.length){y+=rotulo(ctx,T,S.avisos||'Avisos',mx,y,w,s,draw)+10*s;y=linhasDeCartoes(ctx,T,empacota(av,larga?4:3),mx,y,w,s,draw,gap)}}
  else if(L==='colunas'){const lw=w*(larga?.36:.4),rw=w-lw-gap*1.5,rx=mx+lw+gap*1.5;let y1=y,y2=y;
    y1+=rotulo(ctx,T,'Esta semana',mx,y1,lw,s,draw)+10*s;y1=colunasDeLinhas(ctx,T,ag,mx,y1,lw,1,s,draw,gap*.75);
    if(av.length){y2+=rotulo(ctx,T,S.avisos||'Avisos',rx,y2,rw,s,draw)+10*s;y2=linhasDeCartoes(ctx,T,empacota(av,larga?3:2),rx,y2,rw,s,draw,gap)}y=Math.max(y1,y2)}
  else if(L==='destaque'){const hi=av.findIndex(a=>a.destaque);const k=hi>=0?hi:Math.max(0,av.findIndex(a=>a.d0));const hero=av[k];const resto=av.filter((_,i)=>i!==k);

    if(av.length){y+=divisoria(ctx,T,W,y,s,draw)+16*s;y=linhasDeCartoes(ctx,T,empacota(av,cap),mx,y,w,s,draw,gap)}}

/* ---------- render ---------- */
const cv=document.getElementById('cv');let raf=0,ultimoAjuste=1;
let CACHE={sig:'',pages:null};
function ajusta(ctx,W,H,P){let lo=.3,hi=1.3;for(let i=0;i<15;i++){const m=(lo+hi)/2;if(layout(ctx,W,H,m,false,P).h<=H)lo=m;else hi=m}return lo}
/* legibilidade: abaixo disso a letra fica pequena demais no celular */
const MIN_NORMAL=.86,MIN_COMPACTO=.8;
function paginas(ctx,W,H){const full={ag:agendaItens(),av:avisosItens(),primeira:true};
  COMPACT=false;if(ajusta(ctx,W,H,full)>=MIN_NORMAL)return[{P:full,c:false}];
  COMPACT=true;if(ajusta(ctx,W,H,full)>=MIN_COMPACTO||S.paginar==='nao')return[{P:full,c:true}];
  const out=[];let rest=full.av.slice(),first=true;
  while((first||rest.length)&&out.length<8){const ag=first?full.ag:[];let lo=0,hi=rest.length;
    while(lo<hi){const k=Math.ceil((lo+hi)/2);if(ajusta(ctx,W,H,{ag,av:rest.slice(0,k),primeira:first})>=MIN_COMPACTO)lo=k;else hi=k-1}
    let k=lo;if(!first&&k===0)k=1;out.push({P:{ag,av:rest.slice(0,k),primeira:first},c:true});rest=rest.slice(k);first=false}
  return equilibra(ctx,W,H,full,out)}
/* redistribui os avisos entre as imagens (mesma quantidade de imagens) para que a menor letra entre elas seja a maior possível */
function equilibra(ctx,W,H,full,out){const N=out.length;if(N<2)return out;const tot=full.av.length;
  const monta=k1=>{const pg=[{P:{ag:full.ag,av:full.av.slice(0,k1),primeira:true},c:true}];let rest=full.av.slice(k1);for(let i=1;i<N;i++){const per=Math.ceil(rest.length/(N-i));pg.push({P:{ag:[],av:rest.slice(0,per),primeira:false},c:true});rest=rest.slice(per)}return pg};
  const nota=pg=>Math.min(...pg.map(p=>ajusta(ctx,W,H,p.P)));let melhor=out,melhorS=nota(out);const k0=out[0].P.av.length;
  for(let k1=k0;k1>=Math.max(0,k0-7);k1--){const pg=monta(k1);if(pg.some(p=>!p.P.ag.length&&!p.P.av.length))continue;const m=nota(pg);if(m>melhorS+.005){melhor=pg;melhorS=m}}
  return melhor}
function renderAgora(){
  const[W,H]=FORMATOS[S.formato]||FORMATOS.g23;const SC=ESCALA_EXPORT[S.formato]||2;if(cv.width!==Math.round(W*SC)||cv.height!==Math.round(H*SC)){cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);fit()}
  const ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);ctx.textAlign='left';ctx.textBaseline='alphabetic';setLS(ctx,0);
  const sig=JSON.stringify([S.ini,S.modelo,S.layout,S.formato,S.fixos,S.eventos,S.pulos,S.titulo1,S.titulo2,S.versiculo,S.referencia,S.avisos,S.rodape,S.paginar,document.fonts&&document.fonts.status]);
  if(sig!==CACHE.sig)CACHE={sig,pages:paginas(ctx,W,H)};PAGES=CACHE.pages;PAG=Math.max(0,Math.min(PAG,PAGES.length-1));
  const pg=PAGES[PAG];COMPACT=pg.c;PAGINFO=PAGES.length>1?`${PAG+1}/${PAGES.length}`:'';
  const s=ajusta(ctx,W,H,pg.P);ultimoAjuste=s;
  fundo(ctx,W,H);const L=layout(ctx,W,H,s,false,pg.P);const sobra=Math.max(0,H-L.h);
  ctx.save();ctx.translate(0,Math.min(sobra*.5,60*s));layout(ctx,W,H,s,true,pg.P);ctx.restore();
  const U=Math.min(W,H);rodape(ctx,tema(),W,H,H-U*.03-rodape(ctx,null,W,H,0,s,false),s,true);
  if(S.logo!==false){const lh=U*.04,lw=lh*341/159;drawLogo(ctx,W-U*.05-lw,H-U*.035-lh*1.25,lh,tema().logo)}

function miniLayout(k){const sv=b=>`<svg viewBox="0 0 100 54" width="100%" height="100%" preserveAspectRatio="none"><rect width="100" height="54" fill="#1b2440"/>${b}</svg>`,c='#8a93ad',a='#ff8a3d';
  if(k==='calendario')return sv([5,12,19,26,33,40,47].map((y,i)=>`<rect x="6" y="${y}" width="10" height="5" rx="1" fill="${a}" opacity="${i%3?1:.4}"/>`+(i%3?`<rect x="20" y="${y}" width="${30+i*4}" height="5" rx="1.5" fill="${c}" opacity=".55"/>`:`<rect x="20" y="${y+2}" width="74" height="1" fill="${c}" opacity=".3"/>`)).join(''));
  if(k==='linhatempo')return sv(`<rect x="49" y="4" width="2" height="46" fill="${c}" opacity=".6"/>`+[[8,0],[17,1],[26,0],[35,1],[44,0]].map(([y,l])=>`<rect x="${l?56:8}" y="${y-3}" width="36" height="8" rx="1.5" fill="${c}" opacity=".55"/><circle cx="50" cy="${y+1}" r="3" fill="${a}"/>`).join(''));
  if(k==='mosaico')return sv(`<rect x="6" y="5" width="52" height="24" rx="2" fill="${a}" opacity=".85"/><rect x="62" y="5" width="32" height="24" rx="2" fill="${c}" opacity=".55"/><rect x="6" y="33" width="27" height="16" rx="2" fill="${c}" opacity=".55"/><rect x="37" y="33" width="27" height="16" rx="2" fill="${c}" opacity=".55"/><rect x="68" y="33" width="26" height="16" rx="2" fill="${c}" opacity=".55"/>`);
  if(k==='lineup')return sv([7,19,31,43].map(y=>`<text x="8" y="${y+8}" font-size="11" font-weight="700" fill="${a}" font-family="Impact,sans-serif">${['29','30','31','01'][[7,19,31,43].indexOf(y)]}</text><rect x="26" y="${y}" width="${48+((y*7)%20)}" height="5" fill="#e9ecf5" opacity=".85"/><rect x="26" y="${y+7}" width="30" height="2" fill="${c}" opacity=".6"/>`).join(''));
  if(k==='lista')return sv([10,19,28,37,46].map(y=>`<rect x="8" y="${y-4}" width="84" height="7" rx="1.5" fill="${c}" opacity=".5"/><rect x="8" y="${y-4}" width="9" height="7" rx="1.5" fill="${a}"/>`).join(''));
  if(k==='colunas')return sv([8,17,26,35,44].map(y=>`<rect x="6" y="${y}" width="30" height="6" rx="1.5" fill="${c}" opacity=".5"/><rect x="6" y="${y}" width="6" height="6" rx="1.5" fill="${a}"/>`).join('')+`<rect x="42" y="8" width="24" height="18" rx="2" fill="${c}" opacity=".5"/><rect x="70" y="8" width="24" height="18" rx="2" fill="${c}" opacity=".5"/><rect x="42" y="30" width="24" height="18" rx="2" fill="${c}" opacity=".5"/><rect x="70" y="30" width="24" height="18" rx="2" fill="${c}" opacity=".5"/>`);
  if(k==='destaque')return sv(`<rect x="6" y="5" width="88" height="20" rx="2" fill="${c}" opacity=".5"/><rect x="6" y="5" width="26" height="20" rx="2" fill="${a}"/>`+[6,29,52,75].map(x=>`<rect x="${x}" y="29" width="19" height="9" rx="1.5" fill="${c}" opacity=".5"/>`).join('')+`<rect x="6" y="42" width="42" height="7" rx="1.5" fill="${c}" opacity=".5"/><rect x="52" y="42" width="42" height="7" rx="1.5" fill="${c}" opacity=".5"/>`);
  return sv([6,29,52,75].map(x=>`<rect x="${x}" y="6" width="19" height="16" rx="2" fill="${c}" opacity=".5"/>`).join('')+`<rect x="6" y="27" width="42" height="21" rx="2" fill="${c}" opacity=".5"/><rect x="52" y="27" width="19" height="21" rx="2" fill="${c}" opacity=".5"/><rect x="75" y="27" width="19" height="21" rx="2" fill="${c}" opacity=".5"/><rect x="30" y="24" width="40" height="2" fill="${a}"/>`)}
function showTab(t,keep){const st=pane.scrollTop;tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  pane.innerHTML=t==='eventos'?paneEventos():t==='fixos'?paneFixos():t==='visual'?paneVisual():paneSemana();desenhaFiguras();if(keep)pane.scrollTop=st;if(t==='semana')draw()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)showTab(b.dataset.tab)});
const evById=id=>S.eventos.find(e=>e.id===id),fxById=id=>S.fixos.find(f=>f.id===id);
function mudaSemana(n){const d=addD(pd(S.ini),n);S.ini=ds(d);PAG=0;save();draw();showTab(tab,true)}

pane.addEventListener('input',e=>{const t=e.target;const it=t.closest('[data-eid]'),fx=t.closest('[data-fid]');
  if(it&&(t.dataset.k||t.dataset.c)){const ev=evById(it.dataset.eid);if(!ev)return;
    if(t.dataset.c){ev.contatos[+t.dataset.i][t.dataset.c]=t.value}else if(t.type==='checkbox'){if(t.checked)S.eventos.forEach(o=>o.destaque=false);ev.destaque=t.checked}else ev[t.dataset.k]=t.value;save();draw();return}
  if(fx&&t.dataset.k){const f=fxById(fx.dataset.fid);if(!f)return;f[t.dataset.k]=t.dataset.k==='dia'?+t.value:t.value;save();draw();return}
  const map={'v-t1':'titulo1','v-t2':'titulo2','v-av':'avisos','v-rod':'rodape','v-vers':'versiculo','v-ref':'referencia'};if(map[t.id]){S[map[t.id]]=t.value;save();draw();return}});
pane.addEventListener('change',e=>{const t=e.target;
  if(t.id==='f-ini'&&t.value){S.ini=t.value;PAG=0;save();draw();showTab('semana',true);return}
  if(t.id==='v-vlist'&&t.value!==''){const v=VERSOS[+t.value];S.versiculo=v.t;S.referencia=v.r;document.getElementById('v-vers').value=v.t;document.getElementById('v-ref').value=v.r;save();draw();return}
  const it=t.closest('[data-eid]');if(it&&(t.dataset.k==='ini'||t.dataset.k==='fim'||t.dataset.k==='titulo')){const ev=evById(it.dataset.eid);
    if(ev&&ev.fim&&ev.ini&&ev.fim<ev.ini){ev.fim='';toast('A data final era antes da inicial. Deixei só a data inicial.',true)}
    const h=it.querySelector('.item-h small');const p=ev&&pillEvento(ev);if(h&&ev)h.textContent=p?p.join(' · '):'Aviso sem data';save();draw()}});
pane.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const it=b.closest('[data-eid]');const ev=it&&evById(it.dataset.eid);
  const arma=(txt,orig)=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent=txt;setTimeout(()=>{b.classList.remove('armed');b.textContent=orig},3500);return false}return true};
  if(a==='semAnt')mudaSemana(-7);else if(a==='semProx')mudaSemana(7);
  else if(a==='pular'){S.pulos=S.pulos||{};const l=S.pulos[S.ini]=S.pulos[S.ini]||[];const i=l.indexOf(b.dataset.id);if(i>=0)l.splice(i,1);else l.push(b.dataset.id);save();draw();showTab('semana',true)}
  else if(a==='abrir'){aberto=aberto===ev.id?null:ev.id;showTab('eventos',true)}
  else if(a==='novoEv'||a==='novoAviso'){const id=uid('e');const d=a==='novoEv'?ds(addD(pd(S.ini),7)):'';S.eventos.push({id,titulo:a==='novoEv'?'Novo evento':'Novo aviso',sub:'',ini:d,fim:'',hora:'',local:'',desc:'',contatos:[],valor:'',selo:'',icone:'auto',cor:'auto',oculto:false});
    aberto=id;save();draw();showTab('eventos');const n=pane.querySelector(`#e-titulo-${id}`);if(n){n.scrollIntoView({block:'center'});n.select()}}
  else if(a==='ctAdd'){ev.contatos=ev.contatos||[];ev.contatos.push({r:'',n:''});save();showTab('eventos',true);const n=pane.querySelector(`#e-cr-${ev.id}-${ev.contatos.length-1}`);n&&n.focus()}
  else if(a==='ctDel'){ev.contatos.splice(+b.dataset.i,1);save();draw();showTab('eventos',true)}
  else if(a==='ocultar'){ev.oculto=!ev.oculto;save();draw();showTab('eventos',true)}
  else if(a==='delEv'){if(!arma('Confirmar','Apagar evento'))return;S.eventos=S.eventos.filter(x=>x.id!==ev.id);aberto=null;save();draw();showTab('eventos',true);toast('Evento apagado')}
  else if(a==='limparPassados'){if(!arma('Clique de novo para confirmar','Apagar os que já passaram'))return;const h=pd(S.ini);const n0=S.eventos.length;S.eventos=S.eventos.filter(e=>!(e.ini&&pd(e.fim||e.ini)<h));save();showTab('eventos',true);toast(`${n0-S.eventos.length} evento(s) apagado(s)`)}
  else if(a==='novoFixo'){S.fixos.push({id:uid('f'),nome:'Novo culto',dia:3,hora:'20h',local:'',icone:'auto',cor:'auto'});save();draw();showTab('fixos',true);const l=pane.querySelectorAll('[data-k="nome"]');const n=l[l.length-1];if(n){n.scrollIntoView({block:'center'});n.select()}}
  else if(a==='delFixo'){if(!arma('Confirmar','Remover'))return;const id=b.closest('[data-fid]').dataset.fid;S.fixos=S.fixos.filter(f=>f.id!==id);save();draw();showTab('fixos',true)}
  else if(a==='cor'){const alvo=b.dataset.alvo;const o=evById(alvo)||fxById(alvo);if(o){o.cor=b.dataset.v;b.parentElement.querySelectorAll('.b').forEach(x=>x.classList.toggle('on',x===b));const it2=b.closest('.item');const dt=it2&&it2.querySelector('.dot');if(dt)dt.style.background=corDe(o,evById(alvo)?hashIdx(o.id):S.fixos.indexOf(o)).f;save();draw()}}
  else if(a==='modelo'){S.modelo=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='formato'){S.formato=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='figs'){figAberto=figAberto===b.dataset.alvo?null:b.dataset.alvo;showTab(tab,true)}
  else if(a==='fig'){const o=evById(b.dataset.alvo)||fxById(b.dataset.alvo);if(o){o.icone=b.dataset.v;figAberto=null;save();draw();showTab(tab,true);toast('Figura trocada')}}
  else if(a==='paginar'){S.paginar=b.dataset.v;PAG=0;save();draw();showTab('visual',true)}
  else if(a==='layout'){S.layout=b.dataset.v;save();draw();showTab('visual',true)}
  else if(a==='logo'){S.logo=b.dataset.v==='true';save();draw();showTab('visual',true)}
  else if(a==='sortear'){let i;const cur=VERSOS.findIndex(v=>v.r===S.referencia&&v.t===S.versiculo);do{i=Math.floor(Math.random()*VERSOS.length)}while(i===cur);S.versiculo=VERSOS[i].t;S.referencia=VERSOS[i].r;save();draw();showTab('visual',true);toast(VERSOS[i].r)}
  else if(a==='reset'){if(!arma('Clique de novo para confirmar','Restaurar agenda de exemplo'))return;S=JSON.parse(JSON.stringify(DEFAULT));aberto=null;save();draw();showTab('visual');toast('Agenda de exemplo restaurada')}});

/* ---------- texto para o WhatsApp ---------- */
function textoAgenda(){const L=[`*${[S.titulo1,S.titulo2].filter(Boolean).join(' ').toUpperCase()}* (${rotuloSemana()})`];
  agendaItens().forEach(a=>{L.push(`*${DIAS[a.data.getDay()]} ${dm(a.data)}* — ${a.titulo}${a.hora?' · '+a.hora:''}${a.local?' · '+a.local:''}`)});
  const av=avisosItens();if(av.length){L.push('');L.push(`*${(S.avisos||'AVISOS').toUpperCase()}*`);
    av.forEach(a=>{const p=a.pill?a.pill.join(' ').replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/ A /,' a ').replace(/ E /,' e '):'';
      let l=`• ${p?`*${p}* — `:''}*${a.titulo}*`;if(a.sub)l+=` (${a.sub})`;if(a.hora)l+=` · ${a.hora}`;if(a.local)l+=` · ${a.local}`;if(a.valor)l+=` · ${a.valor}`;if(a.selo)l+=` · _${a.selo}_`;L.push(l);
      if(a.desc)L.push('  '+a.desc);a.contatos.forEach(c=>L.push(`  📞 ${c.r?c.r+': ':''}${c.n}`))})}
  const v=String(S.versiculo||'').trim();if(v){L.push('');L.push(`_“${v}”_`);if(S.referencia)L.push(S.referencia)}
  if(S.rodape){L.push('');L.push(S.rodape)}return L.join('\n')}
document.getElementById('copiar').addEventListener('click',()=>{const txt=textoAgenda();const manual=()=>{const m=document.getElementById('m-texto'),a=document.getElementById('m-area');a.value=txt;m.hidden=false;a.focus();a.select()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Texto copiado. É só colar no grupo.'),manual);else manual()}catch(e){manual()}});
document.getElementById('m-fechar').addEventListener('click',()=>{document.getElementById('m-texto').hidden=true});
document.getElementById('m-texto').addEventListener('click',e=>{if(e.target.id==='m-texto')e.target.hidden=true});

/* ---------- download ---------- */
async function salvar(blob,nome){if(window.claude&&typeof window.claude.use==='function'){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:nome,data:blob});return 'ok'}}
    catch(err){if(err&&err.code==='declined')return 'cancelado';if(err&&err.code==='rate_limited'){await new Promise(r=>setTimeout(r,1500));return salvar(blob,nome)}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return 'ok'}
const nomeArq=()=>`agenda-${S.ini}${PAGES.length>1?`-${PAG+1}de${PAGES.length}`:''}${S.formato==='tela'?'-telao':S.formato==='a4'?'-a4':''}.png`;
document.getElementById('baixar').addEventListener('click',async()=>{renderAgora();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob){toast('Não foi possível gerar a imagem.',true);return}
  const r=await salvar(blob,nomeArq());toast(r==='ok'?'Imagem salva':'Download cancelado')});
document.getElementById('baixarTodas').addEventListener('click',async()=>{const atual=PAG;let n=0;for(let i=0;i<PAGES.length;i++){PAG=i;renderAgora();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)continue;
    const r=await salvar(blob,nomeArq());if(r!=='ok'){toast('Download cancelado');break}n++}PAG=atual;renderAgora();if(n)toast(`${n} ${n===1?'imagem salva':'imagens salvas'}`)});
document.getElementById('pgPrev').addEventListener('click',()=>{PAG=(PAG-1+PAGES.length)%PAGES.length;draw()});
document.getElementById('pgNext').addEventListener('click',()=>{PAG=(PAG+1)%PAGES.length;draw()});

/* ---------- início ---------- */
showTab('semana');draw();
const fontes=['700 40px "Playfair Display"','italic 400 40px "Playfair Display"','400 40px Righteous','400 40px "Archivo Black"','400 40px "Special Elite"','700 40px Fredoka','400 40px Pacifico','400 40px "Caveat Brush"','700 40px Caveat','600 40px Caveat','700 40px "Barlow Condensed"','700 40px Nunito','800 40px Nunito','600 40px Nunito','400 40px "Bebas Neue"','600 40px Oswald','800 40px Inter','900 40px Inter','600 40px Inter','italic 400 40px Lora'];
if(document.fonts){Promise.all(fontes.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>draw());document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>draw())}
</script>
